name: Deploy Flutter web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create web platform files
        run: flutter create --platforms web --empty .
      - name: Install packages
        run: flutter pub get
      - name: Apply Chat Plus branding and Android PWA configuration
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          # Android/WebAPK validates the declared icon sizes. Generate real
          # 192x192 and 512x512 PNG files instead of copying one arbitrary-size
          # source image under several different filenames.
          source = Image.open('chat_plus_logo.png').convert('RGBA')
          for size, name in [
              (192, 'Icon-192.png'),
              (512, 'Icon-512.png'),
              (192, 'Icon-maskable-192.png'),
              (512, 'Icon-maskable-512.png'),
          ]:
              source.resize((size, size), Image.Resampling.LANCZOS).save(Path('web/icons') / name, format='PNG')
          source.resize((192, 192), Image.Resampling.LANCZOS).save('web/favicon.png', format='PNG')

          manifest_path = Path('web/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest.update({
              'id': '/ourfamilyapp/',
              'name': 'Chat Plus',
              'short_name': 'Chat Plus',
              'description': 'Private chats and voice calls by username',
              'start_url': '/ourfamilyapp/',
              'scope': '/ourfamilyapp/',
              'display': 'standalone',
              'orientation': 'portrait-primary',
              'background_color': '#F7FAFC',
              'theme_color': '#1F6AA5',
              'icons': [
                  {'src': 'icons/Icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
                  {'src': 'icons/Icon-512.png', 'sizes': '512x512', 'type': 'image/png'},
                  {'src': 'icons/Icon-maskable-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'maskable'},
                  {'src': 'icons/Icon-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'},
              ],
          })
          manifest_path.write_text(json.dumps(manifest, indent=2))

          index_path = Path('web/index.html')
          index = index_path.read_text()
          index = index.replace('<title>our_family_app</title>', '<title>Chat Plus</title>')
          index = index.replace('<title>Our Family</title>', '<title>Chat Plus</title>')
          index = index.replace('content="our_family_app"', 'content="Chat Plus"')
          index = index.replace('content="Our Family"', 'content="Chat Plus"')
          index_path.write_text(index)
          PY
      - name: Prepare Firebase messaging service worker
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('lib/firebase_options.dart').read_text()
          template = Path('firebase-messaging-sw.template.js').read_text()
          values = {
            '__FIREBASE_API_KEY__': re.search(r"apiKey: '([^']+)'", source).group(1),
            '__FIREBASE_APP_ID__': re.search(r"appId: '([^']+)'", source).group(1),
            '__FIREBASE_SENDER_ID__': re.search(r"messagingSenderId: '([^']+)'", source).group(1),
            '__FIREBASE_PROJECT_ID__': re.search(r"projectId: '([^']+)'", source).group(1),
            '__FIREBASE_AUTH_DOMAIN__': re.search(r"authDomain: '([^']+)'", source).group(1),
          }
          for key, value in values.items():
            template = template.replace(key, value)
          Path('web/firebase-messaging-sw.js').write_text(template)
          PY
      - name: Build web app
        env:
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: flutter build web --release --base-href /ourfamilyapp/ --dart-define="FCM_VAPID_KEY=$FCM_VAPID_KEY" --dart-define="TURN_URL=$TURN_URL" --dart-define="TURN_USERNAME=$TURN_USERNAME" --dart-define="TURN_CREDENTIAL=$TURN_CREDENTIAL"
      - name: Disable browser caching for entry files
        run: |
          printf '%s\n' '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">' '<meta http-equiv="Pragma" content="no-cache">' '<meta http-equiv="Expires" content="0">' > /tmp/cache-tags
          sed -i '/<head>/r /tmp/cache-tags' build/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
